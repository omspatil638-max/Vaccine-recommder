<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SmartVax — Adult Immunization Awareness System for India. Understand your options, learn what vaccines may be relevant to you, and ask informed questions." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <title>SmartVax — Adult Immunization Awareness System</title>
    <!-- GitHub Pages SPA: restore encoded path from 404.html redirect -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded[0] +
            (decoded[1] ? '?' + decoded[1] : '') + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <!--
      Netlify Forms detection stub. Netlify's build bot scans deployed HTML for
      forms with the `netlify` attribute and registers their fields. The real,
      styled form is rendered by React (ReminderSignup.jsx) and posts to this
      same form name. Keep the field names here in sync with that component.
    -->
    <form name="vaccine-reminders" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="ageGroup" />
      <input type="text" name="healthConditions" />
      <input type="text" name="frequency" />
      <input type="text" name="submittedAt" />
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
